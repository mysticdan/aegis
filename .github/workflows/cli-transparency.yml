name: Aegis CLI transparency CI

on:
  push:
    branches: [feat/cli-agent-transparency]
  workflow_dispatch:

jobs:
  build-test-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libcjson-dev libcurl4-openssl-dev libsqlite3-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 2
      - name: Run all tests
        run: ctest --test-dir build --output-on-failure
      - name: Demo progress and tool preview with deterministic mock
        run: |
          mkdir -p /tmp/aegis-cli-demo
          ./build/aegis init --workspace /tmp/aegis-cli-demo
          cd /tmp/aegis-cli-demo
          export AEGIS_MOCK_RESPONSES='[{"type":"tool_call","tool":"write_file","arguments":{"path":"demo.txt","content":"hello from CI"}},{"type":"final","message":"Finished demo"}]'
          export AEGIS_MOCK_REASONING_SUMMARY='Checking which tool should run'
          "$GITHUB_WORKSPACE/build/aegis" run --provider mock --yes --task "create demo.txt"
          test "$(cat demo.txt)" = "hello from CI"
